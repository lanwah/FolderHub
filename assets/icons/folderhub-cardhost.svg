<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="FolderHub CardHost">
  <defs>
    <linearGradient id="tile" x1="40" y1="28" x2="220" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2f8a7c"/>
      <stop offset="100%" stop-color="#174f48"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0d2c28" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- app tile -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="none" stroke="#ffffff22" stroke-width="3"/>
  <!-- desktop card -->
  <rect x="58" y="70" width="140" height="116" rx="22" fill="#f7fcfa" filter="url(#soft)"/>
  <!-- mini folder -->
  <path fill="#287c70" d="M74 92h22l8 8h28c5 0 8 3 8 8v28c0 5-3 8-8 8H74c-5 0-8-3-8-8v-36c0-5 3-8 8-8z"/>
  <path fill="#3d9b8a" d="M74 92h20l7 8H74z"/>
  <!-- text lines -->
  <rect x="74" y="156" width="88" height="8" rx="4" fill="#c5ddd6"/>
  <rect x="74" y="172" width="58" height="8" rx="4" fill="#d7e8e2"/>
</svg>
